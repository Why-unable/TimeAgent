# Docker assigns a new internal IP whenever a container is recreated. Resolve
# service names at request time instead of retaining the IP observed when
# Nginx starts, so a backend rebuild cannot leave the gateway serving 502s.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

# Cloudflare Tunnel sends the original public scheme in this header. Preserve
# it for Django while retaining the local HTTP scheme for direct development
# requests.
map $http_x_forwarded_proto $django_forwarded_proto {
    default $scheme;
    "https" https;
}

server {
    listen 80;
    server_name _;

    # Metrics are scraped directly from the Django container by the optional
    # Prometheus service. Never expose application metrics through the public
    # tunnel.
    location = /metrics {
        return 404;
    }

    location ~ ^/releases/([A-Za-z0-9][A-Za-z0-9._-]*\.apk)$ {
        alias /var/www/time-agent-releases/$1;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600, immutable" always;
    }

    location /releases/ {
        return 404;
    }

    # OAuth authorization codes and state arrive in the query string. The
    # default combined access log includes query strings, so suppress access
    # logging for this exact callback and let Django emit only sanitized state.
    location = /api/v1/integrations/calendar/oauth/google/callback/ {
        access_log off;
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $django_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
    }

    # Agent events are long-lived SSE responses. This must precede the
    # generic API route and must not inherit Nginx's short default timeout.
    location ~ ^/api/v1/chat/runs/[0-9a-f-]+/events/$ {
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $django_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    location /api/ {
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $django_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
    }

    location /health/ {
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location /admin/ {
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $django_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }

    location /static/ {
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    # Reserved for future non-API event streams.
    location /events/ {
        set $django_upstream django:8000;
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }
}
