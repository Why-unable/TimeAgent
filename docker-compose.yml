name: time-agent

x-backend: &backend
  build:
    context: ./backend
    args:
      UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.11.29}
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
  env_file:
    - .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  django:
    <<: *backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  celery-worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        FRONTEND_NGINX_IMAGE: ${FRONTEND_NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - django
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
  redis-data:
